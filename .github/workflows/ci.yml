name: iOS checks

on:
  # 默认不在 push / pull_request 上运行：Android 侧的提交不再触发 iOS 检查。
  # 需要时在 Actions 页面手动 Run workflow，或由 release 流程以 workflow_call 复用。
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  core-and-ios:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: xcodebuild -version
      - name: Core tests
        run: zsh scripts/test-core.sh
      - name: IPA verification boundaries
        run: python3 -m unittest discover -s scripts/tests
      - name: Swift formatting
        run: xcrun swift-format lint --strict --recursive Sources Tests ios/MoviePilot ios/MoviePilotUITests ios/MoviePilotWidgets
      - name: Build WidgetKit extension
        run: >-
          xcodebuild build
          -project ios/MoviePilot.xcodeproj
          -scheme MoviePilotWidgets
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
      - name: Build iOS simulator app and UI tests
        run: >-
          xcodebuild build-for-testing
          -project ios/MoviePilot.xcodeproj
          -scheme MoviePilot
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO

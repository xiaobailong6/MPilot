name: Android Debug APK

# 本机没有 Android 编译环境，APK 由 Actions 产出：跑通即代表 android/ 通过编译。
# 触发条件刻意收窄到 android/ 与自身，避免改动 iOS 代码时浪费构建时间。
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble debug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 仓库未提交 gradle-wrapper.jar，因此由 action 直接提供指定版本的 Gradle。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Toolchain info
        run: |
          java -version
          gradle --version

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/ 2>/dev/null || true
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moviepilot-android-debug
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 14